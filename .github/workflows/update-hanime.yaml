name: upload-release
# tag_name: "tag_name"说明：会将指定文件上传到指定tag的release下
# 上传文件前要在“Settings\Actions\General\Workflow permissions”下设置为“Read and write permissions”
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@main
      
    - name: 设置 Python 3.12
      uses: actions/setup-python@main
      with:
        python-version: "3.12"

    - name: 安装 python 依赖库
      run: |
          pip install requests

    - name: 运行 获取ikuuu配置的python脚本
      run: |
        python ./rules/downloads.py
        
    - name: 上传固件到release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "hanime"
        files: "./rules/催眠性指導2.mp4"  # 确保文件路径正确
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
